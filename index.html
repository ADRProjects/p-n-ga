<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>P📍n-ga | El mapa caliente de Cuba</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta name="description" content="¡Qué bolá! P📍n-ga es el mapa interactivo pa' dejar tus mensajes por toda Cuba.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adrprojects.github.io/p-n-ga/">
    <meta property="og:title" content="P📍n-ga | El mapa caliente de Cuba">
    <meta property="og:description" content="¡Qué bolá! P📍n-ga es el mapa interactivo pa' dejar tus mensajes por toda Cuba. Un pin. 128 letras. 24 horas.">
    <meta property="og:image" content="https://adrprojects.github.io/p-n-ga/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- MapLibre & Turf.js -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* 1. Full Screen Layout */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #0f172a; 
            font-family: 'Inter', sans-serif; 
        }

        #map { 
            position: absolute !important; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
        }

        /* 2. Glassmorphism Top Header */
        #top-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            box-sizing: border-box;
        }

        #top-bar h1 { margin: 0 0 5px 0; font-size: 24px; color: white; }
        #top-bar p { margin: 5px 0; font-size: 13px; color: #94a3b8; }
        .status-text { color: #10b981 !important; font-weight: bold; }

        /* 3. Glassmorphism Bottom Dashboard */
        #dashboard {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 16px 24px;
            color: #f8fafc;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: none; /* Hidden until a pin is active */
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        #dashboard h3 { margin: 0; font-size: 14px; color: #38bdf8; }
        #my-pin-msg { font-size: 16px; margin: 0; font-weight: 600; word-break: break-word; }
        #my-pin-time { font-size: 12px; color: #94a3b8; }

        .dash-actions { display: flex; gap: 10px; width: 100%; }
        
        button {
            flex: 1;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-locate { background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-locate:hover { background: #334155; }
        .btn-delete { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; }
        .btn-delete:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6); }

        /* 4. Map Popups */
        .maplibregl-popup-content {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(8px);
            color: #f8fafc !important;
            border-radius: 14px !important;
            padding: 16px 20px !important;
            font-family: 'Inter', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .maplibregl-popup-tip { border-top-color: rgba(15, 23, 42, 0.9) !important; }
        .map-popup h3 { margin: 0 0 8px 0; font-size: 15px; }
        .map-popup span { font-size: 11px; color: #94a3b8; }

        /* 5. Toasts */
        .toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 10px;
            width: 90%; max-width: 400px;
        }
        .custom-toast {
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            color: #f8fafc; padding: 16px 20px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            font-size: 14px; font-weight: 500; text-align: center;
            animation: slideDown 0.3s ease forwards; opacity: 0;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Floating Top Header -->
    <div id="top-bar">
        <h1>P📍n-ga</h1>
        <p>Un pin. 128 letras. 24 horas.</p>
        <p class="status-text">🟢 Estás conectado de incógnito</p>
    </div>

    <!-- Floating Dashboard for Active User Pin -->
    <div id="dashboard">
        <h3>📍 Tu Pin Activo</h3>
        <p id="my-pin-msg"></p>
        <span id="my-pin-time"></span>
        <div class="dash-actions">
            <button id="btn-locate-mine" class="btn-locate">Buscar</button>
            <button id="btn-delete-mine" class="btn-delete">Borrar</button>
        </div>
    </div>

    <!-- The Map -->
    <div id="map"></div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    // CONFIG
    const supabase = createClient('https://diaxhpfqhkkhtmirooos.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpYXhocGZxaGtraHRtaXJvb29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMTAwMDMsImV4cCI6MjEwNzU4NjAwM30.GacIBgNInWUhC_dQjoCiMR64XAqYDOdjJz9cb0AIMmY');
    let currentUser = null;
    let myActivePin = null; 

    const cubaBounds = turf.bboxPolygon([-84.95, 19.82, -74.13, 23.28]);
    const PALETTE = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
    let markers = {}; 

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/bright',
        center: [-79.5, 21.5], 
        zoom: 6,
        minZoom: 5,
        maxZoom: 20 
    });

    // Add Zoom Controls (+ / -)
    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

    const geolocate = new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true
    });
    map.addControl(geolocate, 'top-right');

    function formatLocalTime(utcDateString) {
        return new Date(utcDateString).toLocaleString(undefined, {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
    }

    async function initAuth() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
        } else {
            const { data, error } = await supabase.auth.signInAnonymously();
            if (!error) currentUser = data.user;
        }
    }

    // Live Sync Listener
    function subscribeToRealtime() {
        supabase
            .channel('public:pins')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pins' }, () => {
                loadPins(); // Reload map instantly when anyone adds or deletes a pin
            })
            .subscribe();
    }

    document.getElementById('btn-delete-mine').onclick = async () => {
        if(confirm("¿Seguro que quieres borrar tu pin asere?")) {
            await supabase.from('pins').delete().eq('user_id', currentUser.id);
            showToast("Pin borrado. Ya puedes poner otro.");
        }
    };

    document.getElementById('btn-locate-mine').onclick = () => {
        if (myActivePin) {
            map.flyTo({ center: [myActivePin.longitude, myActivePin.latitude], zoom: 17 });
            if (markers[myActivePin.id]) markers[myActivePin.id].togglePopup();
        }
    };

    async function loadPins() {
        const { data: pins, error } = await supabase
            .from('pins')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) return;

        Object.values(markers).forEach(m => m.remove());
        markers = {};
        myActivePin = null;

        pins.forEach(pin => {
            const localTime = formatLocalTime(pin.created_at);

            const marker = new maplibregl.Marker({ color: pin.color })
                .setLngLat([pin.longitude, pin.latitude])
                .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`
                    <div class="map-popup">
                        <h3>${pin.message}</h3>
                        <span>🕒 ${localTime}</span>
                    </div>
                `))
                .addTo(map);
            
            const markerElement = marker.getElement();
            markerElement.addEventListener('click', (e) => {
                e.stopPropagation(); 
                marker.togglePopup(); 
            });

            markers[pin.id] = marker;

            if (currentUser && pin.user_id === currentUser.id) {
                myActivePin = pin;
            }
        });

        updateDashboardUI();
    }

    function showToast(message) {
        let container = document.getElementById('toast-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            container.className = 'toast-container';
            document.body.appendChild(container);
        }

        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        toast.innerText = message;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-20px)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }

    function updateDashboardUI() {
        const dashboard = document.getElementById('dashboard');
        if (myActivePin) {
            dashboard.style.display = 'flex';
            document.getElementById('my-pin-msg').innerText = myActivePin.message;
            document.getElementById('my-pin-time').innerText = `Publicado: ${formatLocalTime(myActivePin.created_at)}`;
        } else {
            dashboard.style.display = 'none';
        }
    }

    map.on('click', async (e) => {
        if (!currentUser) return showToast("Cargando el mapa, espera un segundo...");
        if (myActivePin) return showToast("Ya tienes un pin activo. Bórralo en tu panel para poner uno nuevo.");

        if (!turf.booleanPointInPolygon(turf.point([e.lngLat.lng, e.lngLat.lat]), cubaBounds)) {
            return showToast("¡Oye! El pin tiene que caer en Cuba, no en el yuma ni en el agua.");
        }

        const msg = prompt("Suelta tu mensaje (Max 128 letras):");
        if (!msg || msg.length > 128) return;

        const pinColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];

        await supabase.from('pins').insert([{
            user_id: currentUser.id, message: msg, color: pinColor,
            latitude: e.lngLat.lat, longitude: e.lngLat.lng
        }]);
    });

    map.on('load', async () => {
        await initAuth();
        await loadPins();
        subscribeToRealtime();
    });
</script>
</body>
</html>
